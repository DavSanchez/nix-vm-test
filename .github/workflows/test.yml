name: Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  linux:
    name: Build (x86_64-linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: DeterminateSystems/magic-nix-cache-action@main
      # Build a representative subset on linux. The full matrix is not
      # run here because image preparation (virt-customize) is the
      # slowest step and is independent of the host platform.
      - name: Build the multi-user test
        run: nix build .#checks.x86_64-linux.ubuntu-22_04-multi-user-test --no-build-output
      - name: Build the shared-dir test
        run: nix build .#checks.x86_64-linux.ubuntu-sharedDirTest --no-build-output
      - name: Build the pathsToRegister test
        run: nix build .#checks.x86_64-linux.ubuntu-pathsToRegisterTest --no-build-output

  darwin:
    name: Evaluate (aarch64-darwin)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: DeterminateSystems/magic-nix-cache-action@main
      # macos-latest is Apple Silicon with HVF enabled. We only
      # evaluate the flake on darwin today because image preparation
      # (virt-customize / guestfs-tools) is Linux-only. Running
      # actual VM tests on darwin is tracked as a follow-up to
      # issue 97; see the project README.
      - name: Evaluate the flake
        run: nix flake check --no-build --all-systems
      - name: Show the darwin lib
        run: nix eval .#lib.aarch64-darwin.ubuntu --apply 'x: builtins.attrNames x' --json
