name: Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  linux:
    name: Build (x86_64-linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: DeterminateSystems/magic-nix-cache-action@main
      # Build a representative subset on linux. The full matrix is not
      # run here because image preparation (virt-customize) is the
      # slowest step and is independent of the host platform.
      - name: Build the multi-user test
        run: nix build .#checks.x86_64-linux.ubuntu-22_04-multi-user-test
      - name: Build the shared-dir test
        run: nix build .#checks.x86_64-linux.ubuntu-sharedDirTest
      - name: Build the pathsToRegister test
        run: nix build .#checks.x86_64-linux.ubuntu-pathsToRegisterTest

  darwin:
    name: Test (aarch64-darwin)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - uses: DeterminateSystems/magic-nix-cache-action@main
      # macos-latest is Apple Silicon with HVF enabled. The image
      # prep on darwin uses cloud-init (no libguestfs), so a small
      # smoke subset is enough to verify the pipeline end to end.
      - name: Build the arch-routing test
        run: nix build .#checks.aarch64-darwin.darwin-archRouting
      - name: Build the darwin multi-user test
        run: nix build .#checks.aarch64-darwin.darwin-darwinMultiUser
      - name: Run the arch-routing test
        run: |
          nix build .#checks.aarch64-darwin.darwin-archRouting
          ./result/bin/test-driver
      - name: Run the darwin multi-user test
        run: |
          nix build .#checks.aarch64-darwin.darwin-darwinMultiUser
          ./result/bin/test-driver
